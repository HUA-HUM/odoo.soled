name: Deploy panel

# El push despliega produccion. Para volver a deploy manual, borrar el bloque
# "push:" y disparar el workflow desde la pestaña Actions.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: panel-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Actualizar los modulos que cambiaron
    runs-on: ubuntu-latest

    steps:
      - name: Desplegar por SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            # El script vive en el repo, asi que primero lo traemos: despues
            # el se encarga de bajar el resto y decidir que actualizar.
            git fetch origin main
            git checkout origin/main -- deploy/deploy.sh
            chmod +x deploy/deploy.sh

            ./deploy/deploy.sh
